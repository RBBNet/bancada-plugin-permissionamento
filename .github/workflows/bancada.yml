name: Bancada

# Execução completa da bancada numa máquina limpa do GitHub. O log de cada passo fica nesta
# página, o resumo aparece no topo da execução e todos os arquivos de evidência (logs dos nós,
# verificações, transações, comandos) ficam anexados como artefato.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: bancada
  cancel-in-progress: false

jobs:
  bancada:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar a bancada
        run: ./executar.sh

      - name: Anexar evidências da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.run_number }}-${{ github.sha }}
          path: |
            execucoes/*/
            !execucoes/*/trabalho/
          retention-days: 90
          if-no-files-found: warn
